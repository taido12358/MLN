services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mln
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: mln
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mln -d mln"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # connection_limit is an explicit choice, not a default we happened to inherit: the api
      # process now uses exactly one shared PrismaClient (see src/prismaClient.ts) instead of the
      # 7 separate instances it used to create, so a small fixed pool is enough and keeps Postgres's
      # own max_connections headroom predictable regardless of how many api replicas ever run.
      DATABASE_URL: postgresql://mln:${POSTGRES_PASSWORD:-devpass}@postgres:5432/mln?connection_limit=10
      PRESENTS_DIR: /data/presents
      TEXTBOOKS_DIR: /data/giao-trinh
    volumes:
      - ../Presents:/data/presents:ro
      - ../giao-trinh-llct/md:/data/giao-trinh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
