server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # Socket.io must come before the generic /api/ block below (nginx matches the first prefix
    # location that fits, and /socket.io/ is not a prefix of /api/ so ordering only matters for
    # clarity here, not correctness) — the critical part is the Upgrade/Connection headers: without
    # them the connection falls back to plain HTTP/1.0 proxying, socket.io's websocket upgrade
    # handshake never completes, and the client silently falls back to (or gets stuck on) polling.
    location /socket.io/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
